name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — set CLOUDFLARE_API_TOKEN secret to enable it."
          fi

      - if: steps.creds.outputs.present == 'true'
        name: Enable corepack
        run: corepack enable

      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - if: steps.creds.outputs.present == 'true'
        name: Install
        run: yarn install --immutable

      - if: steps.creds.outputs.present == 'true'
        name: Build
        run: yarn build

      - if: steps.creds.outputs.present == 'true'
        name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab2343f4691dfe98689e375fc23d4121
        run: npx --yes wrangler@4.157.0 pages deploy dist --project-name=hexsimulator --branch=main
